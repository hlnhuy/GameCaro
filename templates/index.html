<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cờ Caro Online - Giai đoạn 4 (Tối ưu UX)</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>CỜ CARO ONLINE</h1>

    <div id="info-bar">
        <div id="player-left">Bạn:</div>
        <div id="score-center">
            <span id="scoreX">0</span> : <span id="scoreO">0</span>
        </div>
        <div id="player-right">Đối thủ:</div>
    </div>

    <div id="board"></div>

    <div id="popup" class="popup hidden">
        <div class="popup-content">
            <h2 id="popup-message">Trận đấu kết thúc!</h2>
            <button id="replay-btn" onclick="requestReplay()">Chơi lại ngay</button>
        </div>
    </div>

    <div id="start-popup" class="popup">
        <div class="popup-content">
            <h2>🎮 GAME CỜ CARO ONLINE</h2>
            <div id="coin" class="waiting-animation">Đang kết nối...</div>
            <button id="start-btn" onclick="startGame()">BẮT ĐẦU</button>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="/static/game.js"></script>

</body>
</html>
